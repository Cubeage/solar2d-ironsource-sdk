name: JVM Tests

on:
  merge_group:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  jvm-tests:
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Self-contained: compiles android/src/main/java/plugin/ironSource/LuaLoader.java
      # against tests/jvm/stubs and runs the dispatch regression suite. No Android SDK,
      # no Gradle, no network.
      - name: Run JVM regression tests
        run: bash tests/jvm/run.sh

  chat-senders:
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/chat-senders@5cfd55a41435cca8e4b7caf6506faf04ca08d200
        with:
          mode: fail

  # Aggregate gate required on pull requests and merge groups. Skipped jobs pass;
  # a failed or cancelled gating job fails it.
  fast-gate:
    if: always()
    needs: [jvm-tests, chat-senders]
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 5
    steps:
      - name: All gating jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gating job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
